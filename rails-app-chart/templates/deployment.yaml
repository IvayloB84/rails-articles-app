apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-app-deployment
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: rails-web
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: rails-web
    spec:
      containers:
      - name: rails-container
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy | default "Always" }}
        command: ["/bin/sh", "-c"]
        args:
          - |
            bin/rails db:migrate;
            bundle exec rails server -b 0.0.0.0 -p 3000
        env:
        - name: RAILS_ENV
          value: {{ .Values.rails.env | quote }}
        - name: RAILS_SERVE_STATIC_FILES
          value: {{ .Values.rails.serveStaticFiles | quote }}
        - name: RAILS_LOG_TO_STDOUT
          value: {{ .Values.rails.logToStdout | quote }}
        - name: DATABASE_URL
          value: "sqlite3:/app/storage/production.sqlite3"
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: SECRET_KEY_BASE
              name: rails-production-secrets
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /rails/articles
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /app/storage
          name: sqlite-storage
      initContainers:
      - name: volume-permissions-fix
        image: alpine:latest
        imagePullPolicy: Always
        command: ["sh", "-c", "chown -R 1000:1000 /app/storage && chmod -R 775 /app/storage"]
        volumeMounts:
        - mountPath: /app/storage
          name: sqlite-storage
      volumes:
      - name: sqlite-storage
        persistentVolumeClaim:
          claimName: rails-sqlite-pvc

